name: Daily Commit

on:
  schedule:
    - cron: '*/30 * * * *'  # Har 30 minute me
  workflow_dispatch:  # Manual trigger bhi kar sako

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Add newline and commit
        run: |
          echo "" >> README.md
          git config user.email "ag161158@gmail.com"
          git config user.name "Aditya"
          git add README.md
          git commit -m "auto commit: $(date '+%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase
          git push origin main

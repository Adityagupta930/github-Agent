name: Daily Commit

on:
  schedule:
    - cron: '0 */2 * * *'  # Har 2 ghante me trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Multiple commits
        run: |
          git config user.email "ag161158@gmail.com"
          git config user.name "Aditya"
          git pull origin main --rebase
          for i in {1..10}; do
            echo "" >> README.md
            git add README.md
            git commit -m "auto commit: $(date '+%Y-%m-%d %H:%M:%S') - $i"
            sleep 1
          done
          git push origin main

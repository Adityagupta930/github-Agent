name: Daily Commit

on:
  schedule:
    - cron: '0 4 * * *'   # Subah (IST 9:30)
    - cron: '0 10 * * *'  # Dopahar (IST 3:30)
    - cron: '0 16 * * *'  # Shaam (IST 9:30 PM)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Random commits
        run: |
          git config user.email "ag161158@gmail.com"
          git config user.name "Aditya"
          git pull origin main --rebase
          COUNT=$(( RANDOM % 3 + 3 ))
          for i in $(seq 1 $COUNT); do
            echo "" >> README.md
            git add README.md
            git commit -m "auto commit: $(date '+%Y-%m-%d %H:%M:%S') [$i]"
            sleep 1
          done
          git push origin main

name: Daily Commit

on:
  schedule:
    - cron: '0 * * * *' 

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Add newline and commit
        run: |
          echo "" >> README.md
          git config user.email "ag161158@gmail.com"
          git config user.name "Aditya"
          git add README.md
          git commit -m "daily commit: $(date '+%Y-%m-%d')"
          git push

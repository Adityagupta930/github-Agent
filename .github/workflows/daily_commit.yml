name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'   # Raat 12 baje - 8 commits
    - cron: '0 3 * * *'   # Raat 3 baje - 6 commits
    - cron: '0 6 * * *'   # Subah 6 baje - 5 commits
    - cron: '0 9 * * *'   # Subah 9 baje - 7 commits
    - cron: '0 12 * * *'  # Dopahar 12 baje - 8 commits
    - cron: '0 15 * * *'  # Dopahar 3 baje - 6 commits
    - cron: '0 18 * * *'  # Shaam 6 baje - 7 commits
    - cron: '0 21 * * *'  # Raat 9 baje - 5 commits
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Random commits
        run: |
          git config user.email "ag161158@gmail.com"
          git config user.name "Aditya"
          git pull origin main --rebase
          COUNT=$(( RANDOM % 4 + 5 ))
          echo "Aaj $COUNT commits honge"
          for i in $(seq 1 $COUNT); do
            echo "" >> README.md
            git add README.md
            git commit -m "auto commit: $(date '+%Y-%m-%d %H:%M:%S') [$i/$COUNT]"
            sleep 1
          done
          git push origin main
